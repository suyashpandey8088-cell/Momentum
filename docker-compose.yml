name: momentum
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: momentum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-momentum-local-only}
      POSTGRES_DB: momentum
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momentum -d momentum"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
  migrate:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: python database/migrate.py
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://momentum:${POSTGRES_PASSWORD:-momentum-local-only}@db:5432/momentum
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      APP_URL: http://localhost:3000
      API_URL: http://localhost:8000
      COOKIE_SECURE: "false"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENABLE_DEMO: "true"
      EMBEDDED_WORKER: "false"
    depends_on:
      db: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment: *api-env
    ports: ["8000:8000"]
    volumes: [recordings:/srv/momentum/data/private]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
  worker:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: python -m workers.runner
    environment: *api-env
    volumes: [recordings:/srv/momentum/data/private]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args: {API_INTERNAL_URL: "http://api:8000"}
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres-data:
  redis-data:
  recordings:
